<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/pele@1.12.0/dist/pele.global.js; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>Shared diagram | clidraw</title>
  <meta name="description" content="A diagram shared from clidraw, drawn in your browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">

  <main class="viewer">
    <h1>Shared diagram</h1>
    <p>This page draws a diagram from the link. The diagram never leaves your browser.</p>
    <p>
      <button type="button" id="copy-source" disabled>Copy Mermaid</button>
      <button type="button" id="download-svg" disabled>Download SVG</button>
    </p>
    <p id="error" role="alert" hidden></p>
    <div id="diagram"></div>
  </main>

</div>
<script src="wiki-init.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pele@1.12.0/dist/pele.global.js" integrity="sha384-c+QpxCAcAD72seekPP6lAUNHjqe/wUv+S2pk2yBo4ECNKMxym7WFtKKoR5xMtyhz" crossorigin="anonymous"></script>
<script src="view.js"></script>
</body>
</html>
