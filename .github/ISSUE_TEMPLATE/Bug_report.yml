name: Bug Report
description: File a bug report.
title: '[bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        ## Please help us help you!

        Before filing your issue, ask yourself:
        - Is there an issue already opened for this bug?
        - Can I reproduce it?

        In doubt, you can also open [a discussion](https://github.com/shortcuts/clidraw/discussions/new/choose).
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: clidraw-version
    attributes:
      label: clidraw version
      description: Run `clidraw --version` to find it.
      options:
        - 0.1.0
        - Built from main
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Which operating system are you using?
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Which terminal emulator are you using? For example Ghostty, kitty, WezTerm or Windows Terminal.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Write down the steps to reproduce the bug, please include any information that seems relevant for us to reproduce it properly
      placeholder: |
        1. I start clidraw with the canvas `...`
        2. I press the following keys `...`
        3. I resize the terminal to `...`
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant output, including the status line text. Run `cargo run -- probe` to test how your terminal reports keys and mouse events.
      render: shell
  - type: checkboxes
    attributes:
      label: Self-service
      description: |
        If you feel like you could contribute to this issue, please check the box below. This would tell us and other people looking for contributions that someone's working on it.
      options:
        - label: I'd be willing to fix this bug myself.
