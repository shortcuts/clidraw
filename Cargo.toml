[package]
name = "clidraw"
version = "0.1.0"
edition = "2021"

[lib]
name = "clidraw"
path = "src/lib.rs"

[[bin]]
name = "clidraw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
directories = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
