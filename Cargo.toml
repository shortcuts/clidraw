[package]
name = "clidraw"
version = "0.1.0"
edition = "2021"

[lib]
name = "clidraw"
path = "src/lib.rs"

[[bin]]
name = "clidraw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
portable-pty = "0.9"
vt100 = "0.18"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
